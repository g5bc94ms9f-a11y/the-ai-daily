name: Publish The AI Daily

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:17 São Paulo (UTC-3); GitHub may run scheduled tasks late.
    - cron: '17 9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-daily-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publish news first
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site files
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run offline editorial tests
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -v
      - name: Collect and prepare news edition
        run: python scripts/update.py
      - name: Cross-check source links and publisher page metadata
        run: python scripts/editorial_check.py
      - name: Preserve the last successful podcast, if any
        run: python scripts/restore_podcast.py
      - name: Prepare website-only folder
        run: |
          mkdir -p public/data
          cp index.html public/index.html
          cp apple-touch-icon.png public/apple-touch-icon.png
          cp data/edition.js public/data/edition.js
          if test -s public/audio/today.mp3; then
            echo 'Last successful natural-voice podcast included.'
          else
            echo 'No valid prior podcast; publishing news without fabricated audio.'
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Save the daily edition to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/edition.js
          if git diff --cached --quiet; then
            echo 'No edition changes to save'
          else
            git commit -m 'Update the daily AI news edition'
            git push origin HEAD:main
          fi

  podcast:
    name: Generate and publish two-host audio (independent)
    # News is already online, even if this job subsequently times out or fails.
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.audio_deployment.outputs.page_url }}
    steps:
      - name: Download the latest published news edition
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Gemini SDK and audio encoder
        run: |
          python -m pip install --disable-pip-version-check 'google-genai>=2.25,<3'
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Generate a concise natural conversation with Maya and Ben
        id: generate
        timeout-minutes: 6
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SCRIPT_MODEL: gemini-3.8-flash
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
        run: python scripts/build_podcast.py
      - name: Verify the complete MP3 and prepare the updated site
        if: ${{ steps.generate.outcome == 'success' }}
        run: |
          test -s public/audio/today.mp3
          test -s data/podcast/today.mp3
          test -s data/podcast/episode.json
          mkdir -p public/data
          cp index.html public/index.html
          cp apple-touch-icon.png public/apple-touch-icon.png
          cp data/edition.js public/data/edition.js
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 public/audio/today.mp3
      - name: Save the last good podcast and transcript
        if: ${{ steps.generate.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/edition.js data/podcast/episode.json data/podcast/today.mp3
          if git diff --cached --quiet; then
            echo 'Podcast already saved'
          else
            git commit -m 'Publish verified two-host podcast episode'
            git push origin HEAD:main
          fi
      - name: Upload the website with natural audio
        if: ${{ steps.generate.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          name: ai-daily-with-audio
          path: public
      - name: Publish the website with podcast
        if: ${{ steps.generate.outcome == 'success' }}
        id: audio_deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ai-daily-with-audio
      - name: Report recording status
        if: ${{ always() }}
        run: |
          if test -s public/audio/today.mp3; then
            echo 'A full MP3 was generated. Check the deployment step for publication status.'
          else
            echo '::warning title=Podcast unavailable::Gemini did not produce an MP3. The news site has already been published.'
          fi
